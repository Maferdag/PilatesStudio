
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Pilates Studio</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/registro.css') }}">
</head>

<body>

    <div class="registro-container">

        <div class="logo">🧘‍♀️</div>

        <h2>Pilates Studio</h2>

        <p class="subtitulo">
            Descubre una experiencia diseñada para fortalecer tu cuerpo,
            equilibrar tu mente y cuidar tu bienestar.
        </p>

        <form method="POST" action="{{ url_for('registro') }}">

            <label for="correo">Correo electrónico</label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                required>

            <label for="contrasena">Contraseña</label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresa tu contraseña"
                required
                minlength="8">

            <label for="rol">¿Qué tipo de cuenta deseas crear?</label>

            <select id="rol" name="rol" required>
                <option value="alumno">Alumno</option>
                <option value="instructor">Instructor</option>
            </select>

            <div id="datos-instructor" hidden>

                <label for="nombre_completo">Nombre completo</label>

                <input
                    type="text"
                    id="nombre_completo"
                    name="nombre_completo"
                    placeholder="Nombre y apellido">

                <label for="especialidad">Especialidad</label>

                <input
                    type="text"
                    id="especialidad"
                    name="especialidad"
                    placeholder="Ejemplo: Pilates Reformer">

            </div>

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <p class="footer-text">
            ¿Ya tienes una cuenta?
            <a href="{{ url_for('login') }}">Inicia sesión aquí</a>
        </p>

        <p class="pilates-frase">
            "Movimiento, equilibrio y bienestar en cada sesión."
        </p>

    </div>

    <script>

        const selectorRol = document.getElementById('rol');
        const datosInstructor = document.getElementById('datos-instructor');
        const nombreInstructor = document.getElementById('nombre_completo');

        function actualizarFormulario() {

            const esInstructor = selectorRol.value === 'instructor';

            datosInstructor.hidden = !esInstructor;
            nombreInstructor.required = esInstructor;

        }

        selectorRol.addEventListener('change', actualizarFormulario);

        actualizarFormulario();

    </script>

</body>
</html>
