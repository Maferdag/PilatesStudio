<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Pilates Studio</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/recuperar.css') }}">
</head>

<body>

    <div class="recuperar-container">

        <div class="logo">🧘‍♀️</div>

        <h2>Recuperar Contraseña</h2>

        {% if mensaje %}

            <div class="mensaje-exito">
                {{ mensaje }}
            </div>

            <a href="/login" class="btn-volver">
                Volver al Login
            </a>

        {% else %}

            <p class="subtitulo">
                Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <form method="POST" action="/recuperar">

                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required>

                <button type="submit">
                    Enviar Enlace
                </button>

            </form>

            <p class="footer-text">
                <a href="/login">← Volver al Login</a>
            </p>

            <p class="pilates-frase">
                "Tu bienestar comienza con cada paso que das."
            </p>

        {% endif %}

    </div>

</body>

</html>
