<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pilates Studio</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="logo">🪷</div>

        <h2>Pilates Studio</h2>

        <p class="subtitulo">
            Bienvenida nuevamente. Inicia sesión y continúa tu camino hacia el bienestar.
        </p>

        <form method="POST" action="/login">

            <label for="correo">Correo electrónico</label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                required>

            <label for="contrasena">Contraseña</label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresa tu contraseña"
                required>

            <button type="submit">
                Iniciar Sesión
            </button>

        </form>

        <p class="footer-text">
            <a href="/recuperar">¿Olvidaste tu contraseña?</a>
        </p>

        <p class="footer-text">
            ¿No tienes una cuenta?
            <a href="/registro">Regístrate aquí</a>
        </p>

        <p class="pilates-frase">
            "Cada movimiento te acerca a tu mejor versión."
        </p>

    </div>

</body>

</html>
